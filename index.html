<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melofy - Web Player: Music for everyone</title>
  <link rel="icon" type="image/x-icon" href="Images/favicon.ico" />
  <link rel="stylesheet" href="css/utility.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="authScreen" class="auth-screen" aria-hidden="true">
    <div class="auth-card" role="dialog" aria-modal="true" aria-label="Login">
      <div class="auth-container">
        <h2>Welcome</h2>
        <p class="auth-subtitle">Sign in to unlock your music collection.</p>

        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchAuthTab('loginSection')">Login</button>
          <button class="auth-tab" onclick="switchAuthTab('signupSection')">Sign Up</button>
        </div>

        <div class="auth-body">

          <!-- LOGIN -->
          <div id="loginSection" class="auth-section">
            <div id="loginSuccess" class="success-message"></div>
            <div id="loginError" class="error-message"></div>

            <form onsubmit="loginUser(event)">
              <div class="form-group">
                <input type="email" id="loginEmail" placeholder=" " required />
                <label class="form-floating-label" for="loginEmail">Email</label>
              </div>
              <div class="form-group password-field">
                <input type="password" id="loginPassword" placeholder=" " required />
                <label class="form-floating-label" for="loginPassword">Password</label>
                <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')"
                  tabindex="-1">👁️</button>
              </div>
              <button type="submit">Continue</button>
            </form>
          </div>

          <!-- SIGNUP -->
          <div id="signupSection" class="auth-section" style="display:none;">
            <div id="signupSuccess" class="success-message"></div>
            <div id="signupError" class="error-message"></div>

            <form onsubmit="signupUser(event)">
              <div class="form-group">
                <input type="email" id="signupEmail" placeholder=" " required />
                <label class="form-floating-label" for="signupEmail">Email</label>
              </div>
              <div class="form-group password-field">
                <input type="password" id="signupPassword" placeholder=" " required />
                <label class="form-floating-label" for="signupPassword">Password</label>
                <button type="button" class="password-toggle" onclick="togglePassword('signupPassword')"
                  tabindex="-1">👁️</button>
              </div>
              <button type="submit">Create Account</button>
            </form>
          </div>

        </div>
      </div>
      <button class="auth-close" type="button" aria-label="Close login" onclick="hideLoginOverlay()">✕</button>
    </div>
  </div>

  <div class="container bg-black flex">
    <div class="left border">
      <div class="close">
        <img class="invert" src="Images/close.svg" alt="Close" />
      </div>
      <div class="home bg-grey rounded m-1 p-1">
        <div class="logo">
          <img width="150" src="Images/logo.svg" alt="Melofy Logo" />
        </div>
      </div>

      <div class="library bg-grey rounded m-1 p-1">
        <div class="heading">
          <img class="invert" src="Images/playlist.svg" alt="playlist Logo" />
          <h2>Your library</h2>
        </div>
        <div class="songlist">
          <ul></ul>
        </div>
        <div class="footer">
          <div>
            <a href="https://www.Melofy.com/jp/legal/"><span>Legal</span></a>
          </div>
          <div>
            <a href="https://www.Melofy.com/jp/privacy/"><span>Privacy Center</span></a>
          </div>
          <div>
            <a href="https://www.Melofy.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
          </div>
          <div>
            <a href="https://www.Melofy.com/jp/legal/cookies-policy/"><span>Cookies</span></a>
          </div>
          <div>
            <a href="https://www.Melofy.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a>
          </div>
          <div>
            <a href="https://www.Melofy.com/jp/accessibility/"><span>Accessibility</span></a>
          </div>
        </div>
      </div>
    </div>

    <div class="right bg-grey rounded">
      <div class="header">
        <div class="nav">
          <div class="hamburgerContainer">
            <img class="invert hamburger" src="Images/hamburger.svg" alt="Hamburger Menu" />
          </div>
        </div>

        <div class="search">
          <img class="invert" width="10px" src="Images/search.svg" alt="Search Logo" />
          <input type="text" id="searchInput" placeholder="Search..." />
        </div>

        <div class="view-toggle">
          <button class="view-btn active" data-view="playlists">Playlists</button>
          <button class="view-btn" data-view="favorites">Liked</button>
        </div>

        <div class="buttons" id="authButtons">
          <button class="auth-btn Signupbtn" onclick="openAuthScreen('signup')">Sign up</button>
          <button class="auth-btn Loginbtn" onclick="openAuthScreen('login')">Log in</button>
        </div>

        <div class="user-info" id="userInfo">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">User</span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

      </div>
      <!-- end header -->

      <div class="melofy-playlist">
        <h1>Melofy Playlists</h1>
        <div class="cardContainer"></div>
      </div>

      <div class="favorites-section hidden">
        <h1>Liked Songs</h1>
        <div class="favoriteList"></div>
        <p class="empty-state">No liked songs yet. Tap the heart on any track to add it here.</p>
      </div>

      <div class="playbar">
        <div class="seekbar" aria-label="Seek bar" role="slider" tabindex="0">
          <div class="seekbar-track">
            <div class="seekbar-buffer"></div>
            <div class="seekbar-progress"></div>
          </div>
          <div class="seekbar-thumb"></div>
          <div class="seekbar-tooltip">0:00</div>
        </div>
        <div class="abovebar">
          <div class="songinfo"></div>
          <div class="songbuttons">
            <img width="35" id="previous" src="Images/previoussong.svg" alt="Previous" />
            <img width="35" id="play" src="Images/play.svg" alt="Play/Pause" />
            <img width="35" id="next" src="Images/next.svg" alt="Next" />
            <button class="like-btn" id="currentLike" title="Like Current Song" aria-label="Toggle like">♥</button>
          </div>
          <div class="timevol">
            <div class="songtime"></div>

            <div class="volume">
              <img id="volIcon" src="Images/volume.svg" alt="Volume" width="80" style="cursor:pointer;" />
              <div class="volrange">
                <input type="range" name="volume" id="volSlider" min="0" max="100" value="100" />
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    <!-- end right -->
  </div>
  <!-- end container -->

  <audio id="currentSong" preload="metadata"></audio>
  <script src="js/script.js"></script>
</body>

</html>
